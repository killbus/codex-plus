name: windows-cli-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      RUST_TOOLCHAIN: 1.95.0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: x86_64-pc-windows-msvc
      - name: Verify source and patch chain
        shell: bash
        run: |
          python scripts/verify_provenance.py \
            --patch patches/goal-old-continuation.patch \
            --patch patches/goal-transient-continuation.patch
      - name: Test Goal extension
        shell: bash
        working-directory: codex-src/codex-rs
        run: cargo test -p codex-goal-extension
      - name: Test Shadow extension
        shell: bash
        working-directory: codex-src/codex-rs
        run: cargo test -p codex-shadow-extension
      - name: Check app-server integration
        shell: bash
        working-directory: codex-src/codex-rs
        run: cargo check -p codex-app-server
      - name: Build CLI
        shell: bash
        working-directory: codex-src/codex-rs
        run: cargo build -p codex-cli --release --target x86_64-pc-windows-msvc
      - name: Stage allowlisted archive
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "codex-plus-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "codex-src/codex-rs/target/x86_64-pc-windows-msvc/release/codex.exe" $stage
          Copy-Item LICENSE, NOTICE, TRADEMARKS.md $stage
          $provenance = Get-Content docs/provenance.json -Raw | ConvertFrom-Json
          $patchHashes = $provenance.patch_sha256 -join ","
          @(
            "source_commit=$($provenance.commit)"
            "repository_commit=$(git rev-parse HEAD)"
            "source_tree_sha256=$($provenance.source_tree_sha256)"
            "rebuilt_tree_sha256=$($provenance.rebuilt_tree_sha256)"
            "cargo_lock_sha256=$((Get-FileHash codex-src/codex-rs/Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant())"
            "patch_sha256=$patchHashes"
            "toolchain=$env:RUST_TOOLCHAIN"
            "runner=$env:RUNNER_OS/$env:RUNNER_ARCH"
            "built_at_utc=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content (Join-Path $stage "BUILD-INFO.txt")
          "$((Get-FileHash (Join-Path $stage 'codex.exe') -Algorithm SHA256).Hash.ToLowerInvariant())  codex.exe" |
            Set-Content (Join-Path $stage "SHA256SUMS")
          python scripts/check_release_allowlist.py $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $env:RUNNER_TEMP "codex-plus-windows-x64.zip")
          "$((Get-FileHash (Join-Path $env:RUNNER_TEMP 'codex-plus-windows-x64.zip') -Algorithm SHA256).Hash.ToLowerInvariant())  codex-plus-windows-x64.zip" |
            Set-Content (Join-Path $env:RUNNER_TEMP "codex-plus-windows-x64.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: codex-plus-windows-x64
          path: |
            ${{ runner.temp }}/codex-plus-windows-x64.zip
            ${{ runner.temp }}/codex-plus-windows-x64.zip.sha256
