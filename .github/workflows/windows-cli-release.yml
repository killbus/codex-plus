name: windows-cli-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      RUST_TOOLCHAIN: 1.95.0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: x86_64-pc-windows-msvc
      - name: Verify source and patch chain
        shell: bash
        run: |
          python scripts/verify_provenance.py \
            --patch patches/goal-old-continuation.patch \
            --patch patches/goal-transient-continuation.patch
      - name: Test Goal extension
        shell: bash
        working-directory: codex-src/codex-rs
        run: cargo test -p codex-goal-extension
      - name: Build CLI
        shell: bash
        working-directory: codex-src/codex-rs
        run: cargo build -p codex-cli --release --target x86_64-pc-windows-msvc
      - name: Stage allowlisted archive
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "codex-plus-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "codex-src/codex-rs/target/x86_64-pc-windows-msvc/release/codex.exe" $stage
          Copy-Item LICENSE, NOTICE, TRADEMARKS.md $stage
          "source=$(git rev-parse HEAD)" | Set-Content (Join-Path $stage "BUILD-INFO")
          Get-ChildItem $stage -File | Select-Object -ExpandProperty Name | Set-Content (Join-Path $env:RUNNER_TEMP "codex-plus-files.txt")
          python scripts/check_release_allowlist.py $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $env:RUNNER_TEMP "codex-plus-windows-x64.zip")
          (Get-FileHash (Join-Path $env:RUNNER_TEMP "codex-plus-windows-x64.zip") -Algorithm SHA256).Hash | Set-Content (Join-Path $env:RUNNER_TEMP "codex-plus-windows-x64.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: codex-plus-windows-x64
          path: |
            ${{ runner.temp }}/codex-plus-windows-x64.zip
            ${{ runner.temp }}/codex-plus-windows-x64.zip.sha256
