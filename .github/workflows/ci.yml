name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "8388608"
  RUST_TOOLCHAIN: 1.95.0

jobs:
  shadow-runtime:
    name: Pending work ownership red evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-src/codex-rs

      - name: Check formatting
        working-directory: codex-src/codex-rs
        run: cargo fmt --all -- --check

      - name: Compile pending work ownership contract
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-core pending_work_start_does_not_steal_user_pending_input_after_reservation_replacement --lib --no-run

      - name: Test pending work ownership contract
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-core pending_work_start_does_not_steal_user_pending_input_after_reservation_replacement --lib

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: taiki-e/install-action@just

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-src/codex-rs

      - name: Check formatting
        working-directory: codex-src/codex-rs
        run: cargo fmt --all -- --check

      - name: Verify provenance and patch chain
        run: python scripts/verify_provenance.py --check --patch patches/goal-old-continuation.patch --patch patches/shadow-mind.patch

      - name: Generate app-server schema fixtures
        id: generate_app_server_schema
        working-directory: codex-src/codex-rs
        run: just write-app-server-schema

      - name: Upload generated app-server schemas
        if: always() && steps.generate_app_server_schema.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-server-schema-fixtures
          path: codex-src/codex-rs/app-server-protocol/schema

      - name: Generate Bazel module lock
        id: generate_bazel_module_lock
        working-directory: codex-src
        run: just bazel-lock-update

      - name: Upload generated Bazel module lock
        if: always() && steps.generate_bazel_module_lock.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bazel-module-lock
          path: codex-src/MODULE.bazel.lock

      - name: Test goal-only compatibility baseline
        run: |
          goal_only="$RUNNER_TEMP/codex-goal-only"
          commit="$(python -c 'import json; print(json.load(open("docs/provenance.json"))["commit"])')"
          git init --quiet "$goal_only"
          git -C "$goal_only" remote add origin https://github.com/openai/codex.git
          git -C "$goal_only" fetch --quiet --depth=1 --filter=blob:none origin "$commit"
          git -C "$goal_only" checkout --quiet --detach FETCH_HEAD
          git -C "$goal_only" apply "$GITHUB_WORKSPACE/patches/goal-old-continuation.patch"
          cargo test --manifest-path "$goal_only/codex-rs/Cargo.toml" -p codex-goal-extension turn_error_

      - name: Check Shadow extension
        working-directory: codex-src/codex-rs
        run: cargo check --locked -p codex-shadow-extension

      - name: Check app-server integration
        working-directory: codex-src/codex-rs
        run: cargo check --locked -p codex-app-server

      - name: Check TUI integration
        working-directory: codex-src/codex-rs
        run: cargo check --locked -p codex-tui

      - name: Test Shadow extension
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-shadow-extension

      - name: Test extension item wire contracts
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-extension-items

      - name: Test app-server protocol and schema contracts
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-app-server-protocol

      - name: Test Goal extension
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-goal-extension

      - name: Test dropped-stream Goal lifecycle with Shadow
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-app-server --test all suite::v2::thread_resume::dropped_stream_goal_turn_error_starts_next_automatic_turn_with_shadow -- --exact

      - name: Test changed TUI integration
        working-directory: codex-src/codex-rs
        run: |
          cargo test --locked -p codex-tui shadow_
          cargo test --locked -p codex-tui side_conversation_hides_commands_without_side_flag
          cargo test --locked -p codex-tui certain_commands_are_available_during_task

      - name: Test lifecycle injection contract
        working-directory: codex-src/codex-rs
        run: |
          cargo test --locked -p codex-core try_start_turn_if_idle --lib
          cargo test --locked -p codex-core thread_idle --lib

      - name: Test Shadow rollout persistence
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-rollout shadow_report

      - name: Lint affected crates
        working-directory: codex-src/codex-rs
        run: >-
          cargo clippy --locked
          -p codex-analytics
          -p codex-app-server-protocol
          -p codex-core
          -p codex-extension-api
          -p codex-extension-items
          -p codex-goal-extension
          -p codex-rollout
          -p codex-shadow-extension
          -p codex-thread-store
          -p codex-tui
          --all-targets -- -D warnings

      - name: Check app-server schema fixture drift
        if: always()
        working-directory: codex-src/codex-rs
        run: git diff --exit-code -- app-server-protocol/schema

      - name: Check Bazel module lock drift
        if: always()
        working-directory: codex-src
        run: git diff --exit-code -- MODULE.bazel.lock
