name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.0

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-src/codex-rs

      - name: Check formatting
        working-directory: codex-src/codex-rs
        run: cargo fmt --all -- --check

      - name: Verify provenance and patch chain
        run: python scripts/verify_provenance.py --check --patch patches/goal-old-continuation.patch --patch patches/goal-transient-continuation.patch --patch patches/shadow-mind.patch

      - name: Test goal-only compatibility baseline
        run: |
          goal_only="$RUNNER_TEMP/codex-goal-only"
          commit="$(python -c 'import json; print(json.load(open("docs/provenance.json"))["commit"])')"
          git init --quiet "$goal_only"
          git -C "$goal_only" remote add origin https://github.com/openai/codex.git
          git -C "$goal_only" fetch --quiet --depth=1 --filter=blob:none origin "$commit"
          git -C "$goal_only" checkout --quiet --detach FETCH_HEAD
          git -C "$goal_only" apply "$GITHUB_WORKSPACE/patches/goal-old-continuation.patch"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/codex-src/codex-rs/target" \
            cargo test --locked --manifest-path "$goal_only/codex-rs/Cargo.toml" -p codex-goal-extension turn_error_

      - name: Check Shadow extension
        working-directory: codex-src/codex-rs
        run: cargo check --locked -p codex-shadow-extension

      - name: Check app-server integration
        working-directory: codex-src/codex-rs
        run: cargo check --locked -p codex-app-server

      - name: Check TUI integration
        working-directory: codex-src/codex-rs
        run: cargo check --locked -p codex-tui

      - name: Test Shadow extension
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-shadow-extension

      - name: Test Goal extension
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-goal-extension

      - name: Test transient Goal lifecycle
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-app-server --test all suite::v2::thread_resume::transient_goal_turn_error_starts_next_automatic_turn -- --exact

      - name: Test TUI integration
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-tui

      - name: Test lifecycle injection contract
        working-directory: codex-src/codex-rs
        run: cargo test --locked -p codex-core inject_if_running_for_turn --lib

      - name: Lint changed extensions
        working-directory: codex-src/codex-rs
        run: cargo clippy --locked -p codex-shadow-extension -p codex-goal-extension -p codex-tui --all-targets -- -D warnings
