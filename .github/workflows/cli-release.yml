name: CLI release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            binary: codex.exe
            check_profile: dev
          - platform: windows-arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            binary: codex.exe
            check_profile: dev
          - platform: macos-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            binary: codex
            check_profile: dev
          - platform: macos-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            binary: codex
            check_profile: dev
          - platform: linux-musl-x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            binary: codex
            musl: true
            check_profile: release
          - platform: linux-musl-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            binary: codex
            musl: true
            check_profile: release
    env:
      RUST_TOOLCHAIN: 1.95.0
      CARGO_TERM_COLOR: always
      RUST_TARGET: ${{ matrix.rust_target }}
      RELEASE_BINARY: ${{ matrix.binary }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}

      - name: Use hermetic Cargo home (musl)
        if: matrix.musl == true
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-src/codex-rs

      - name: Configure transient network retries (musl)
        if: matrix.musl == true
        shell: bash
        run: |
          set -euo pipefail
          curl_home="${RUNNER_TEMP}/codex-plus-curl"
          mkdir -p "${curl_home}"
          cat > "${curl_home}/.curlrc" <<'EOF'
          retry = 8
          retry-all-errors
          retry-delay = 2
          retry-max-time = 300
          connect-timeout = 30
          EOF
          echo "CURL_HOME=${curl_home}" >> "$GITHUB_ENV"

      - name: Install Zig (musl)
        if: matrix.musl == true
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build dependencies
        if: matrix.musl == true
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_UPDATE_ARGS: -o Acquire::Retries=3
          APT_INSTALL_ARGS: --no-install-recommends
        shell: bash
        run: |
          TARGET="${{ matrix.rust_target }}" \
            bash "${GITHUB_WORKSPACE}/codex-src/.github/scripts/install-musl-build-tools.sh"

      - name: Disable aws-lc jitter entropy (musl)
        if: matrix.musl == true
        shell: bash
        run: |
          set -euo pipefail
          # Avoid problematic aws-lc jitter entropy code path on musl builders.
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.rust_target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure Codex-built rusty_v8 artifacts (musl)
        if: matrix.musl == true
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.rust_target }}"
          version="$(python3 -B codex-src/.github/scripts/rusty_v8_bazel.py resolved-v8-crate-version)"
          base_url="https://github.com/openai/codex/releases/download/rusty-v8-v${version}"
          # Keep the override path unique per attempt so a restored Cargo
          # fingerprint (or rusty_v8 path marker) cannot skip copying the
          # archive into a target directory from an earlier runner.
          artifact_dir="${RUNNER_TEMP}/rusty_v8/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="${artifact_dir}/librusty_v8_release_${target}.a.gz"
          binding="${artifact_dir}/src_binding_release_${target}.rs"
          checksums="${artifact_dir}/rusty_v8_release_${target}.sha256"

          mkdir -p "${artifact_dir}"
          curl -fsSL "${base_url}/$(basename "${archive}")" -o "${archive}"
          curl -fsSL "${base_url}/$(basename "${binding}")" -o "${binding}"
          curl -fsSL "${base_url}/$(basename "${checksums}")" -o "${checksums}"
          if [[ "$(wc -l < "${checksums}")" -ne 2 ]]; then
            echo "Expected exactly two rusty_v8 checksums for ${target}" >&2
            exit 1
          fi
          (cd "${artifact_dir}" && sha256sum -c "$(basename "${checksums}")")
          echo "RUSTY_V8_ARCHIVE=${archive}" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding}" >> "$GITHUB_ENV"

      - name: Verify source and patch chain
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_provenance.py --check \
            --patch patches/goal-old-continuation.patch \
            --patch patches/shadow-mind.patch

      - name: Test Goal extension
        shell: pwsh
        working-directory: codex-src/codex-rs
        run: |
          $profileArgs = @()
          if ("${{ matrix.check_profile }}" -eq "release") {
            $profileArgs = @("--release")
          }
          cargo test --locked @profileArgs --target $env:RUST_TARGET -p codex-goal-extension

      - name: Test Shadow extension
        shell: pwsh
        working-directory: codex-src/codex-rs
        run: |
          $profileArgs = @()
          if ("${{ matrix.check_profile }}" -eq "release") {
            $profileArgs = @("--release")
          }
          cargo test --locked @profileArgs --target $env:RUST_TARGET -p codex-shadow-extension

      - name: Check app-server integration
        shell: pwsh
        working-directory: codex-src/codex-rs
        run: |
          $profileArgs = @()
          if ("${{ matrix.check_profile }}" -eq "release") {
            $profileArgs = @("--release")
          }
          cargo check --locked @profileArgs --target $env:RUST_TARGET -p codex-app-server

      - name: Build and smoke-test CLI
        shell: pwsh
        working-directory: codex-src/codex-rs
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "none"
          CARGO_PROFILE_RELEASE_STRIP: "symbols"
        run: |
          # Upstream archives symbols and strips binaries before packaging. This
          # CLI-only distribution emits no symbols artifact, so apply that intent
          # at build time and avoid generating debug sidecars in the first place.
          cargo build --locked --release --target $env:RUST_TARGET -p codex-cli --bin codex
          $binPath = Join-Path $PWD "target/$env:RUST_TARGET/release/$env:RELEASE_BINARY"
          & $binPath --version
          "BIN_PATH=$binPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage and validate CLI archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "codex-plus-stage"
          $archive = Join-Path $env:RUNNER_TEMP "codex-plus-${{ matrix.platform }}.zip"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $env:BIN_PATH -Destination (Join-Path $stage $env:RELEASE_BINARY)
          Copy-Item LICENSE, NOTICE, TRADEMARKS.md -Destination $stage

          $provenance = Get-Content docs/provenance.json -Raw | ConvertFrom-Json
          $patchHashes = $provenance.patch_sha256 -join ","
          @(
            "source_commit=$($provenance.commit)"
            "repository_commit=$(git rev-parse HEAD)"
            "source_tree_sha256=$($provenance.source_tree_sha256)"
            "rebuilt_tree_sha256=$($provenance.rebuilt_tree_sha256)"
            "cargo_lock_sha256=$((Get-FileHash codex-src/codex-rs/Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant())"
            "patch_sha256=$patchHashes"
            "toolchain=$env:RUST_TOOLCHAIN"
            "target=$env:RUST_TARGET"
            "runner=$env:RUNNER_OS/$env:RUNNER_ARCH"
            "built_at_utc=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content (Join-Path $stage "BUILD-INFO.txt")

          $binaryHash = (Get-FileHash (Join-Path $stage $env:RELEASE_BINARY) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$binaryHash  $env:RELEASE_BINARY" | Set-Content (Join-Path $stage "SHA256SUMS")
          python scripts/check_release_allowlist.py $stage --binary $env:RELEASE_BINARY

          $unexpected = Join-Path $stage "unexpected-file"
          Set-Content -LiteralPath $unexpected -Value "allowlist regression probe"
          $PSNativeCommandUseErrorActionPreference = $false
          python scripts/check_release_allowlist.py $stage --binary $env:RELEASE_BINARY
          $probeExit = $LASTEXITCODE
          if ($probeExit -eq 0) { throw "allowlist accepted an undeclared file" }
          Remove-Item -LiteralPath $unexpected -Force
          python scripts/check_release_allowlist.py $stage --binary $env:RELEASE_BINARY

          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash  $(Split-Path $archive -Leaf)" |
            Set-Content (Join-Path $env:RUNNER_TEMP "codex-plus-${{ matrix.platform }}.zip.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: codex-plus-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/codex-plus-${{ matrix.platform }}.zip
            ${{ runner.temp }}/codex-plus-${{ matrix.platform }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  audit:
    name: Audit downloaded release artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: codex-plus-*
          path: audit
          merge-multiple: false

      - name: Recompute ZIP and embedded checksums
        shell: bash
        run: python scripts/audit_release_artifacts.py audit --repository-commit "$GITHUB_SHA"
